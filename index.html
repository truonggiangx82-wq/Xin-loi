<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xin lỗi ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#ffe6ee;font-family:Arial,sans-serif;overflow:hidden}.box{width:90%;max-width:500px;max-height:80vh;padding:25px;text-align:center;background:white;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,.15);overflow-y:auto}h1{color:#ff4f81}.heart{font-size:80px;animation:beat 1s infinite}.sorry{color:#555;line-height:1.8}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="box">
<div class="heart">❤️</div>
<h1>Xin lỗi cậu ❤️</h1>
<div class="sorry" id="sorry"></div>
</div>
<script>
const box=document.getElementById('sorry');
for(let i=1;i<=100;i++){box.innerHTML += `Xin lỗi cậu ❤️<br>`;}
</script>
</body>
</html>
